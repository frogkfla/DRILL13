<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LEC05 2D 게임프로그래밍 기초</title>
  <style>
    @import url("https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css");
    @import url("https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap");

    :root {
      --bg: #edf1f5;
      --paper: #ffffff;
      --ink: #172033;
      --muted: #5c6776;
      --line: #d7dde6;
      --accent: #1767a8;
      --green: #16806f;
      --code-bg: #101827;
      --code-ink: #f0f6ff;
      --code-font: "JetBrains Mono", Consolas, "Courier New", monospace;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--ink);
      font-family: "Pretendard", "Malgun Gothic", "Segoe UI", Arial, sans-serif;
    }

    body { overflow: hidden; }

    .app {
      height: 100vh;
      display: grid;
      grid-template-rows: auto 1fr auto;
    }

    header.top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      padding: 14px 24px;
      background: #fff;
      border-bottom: 1px solid var(--line);
    }

    .brand strong {
      display: block;
      font-size: 18px;
    }

    .brand span {
      display: block;
      margin-top: 4px;
      color: var(--muted);
      font-size: 13px;
    }

    .counter {
      display: flex;
      align-items: center;
      gap: 12px;
      color: var(--muted);
      font-size: 14px;
      white-space: nowrap;
    }

    .bar {
      width: 180px;
      height: 8px;
      background: #dfe6ef;
      border-radius: 999px;
      overflow: hidden;
    }

    .bar-fill {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, var(--accent), var(--green));
    }

    main {
      min-height: 0;
      display: grid;
      grid-template-columns: minmax(0, 1fr) 320px;
      gap: 18px;
      padding: 18px 24px;
    }

    .stage {
      min-width: 0;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .slide {
      display: none;
      width: min(100%, 1240px);
      height: min(100%, calc((100vw - 420px) * 0.5625));
      min-height: 620px;
      max-height: calc(100vh - 134px);
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 14px 34px rgba(23, 32, 51, 0.14);
      grid-template-rows: auto 1fr;
    }

    .slide.active {
      display: grid;
    }

    .slide-head {
      padding: 28px 34px 18px;
      border-bottom: 1px solid var(--line);
      background: linear-gradient(180deg, #fff, #f7f9fc);
    }

    .kicker {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
      color: var(--accent);
      font-size: 16px;
      font-weight: 700;
    }

    .pill {
      padding: 5px 10px;
      border-radius: 999px;
      background: #e8f2fb;
      color: var(--accent);
      font-size: 13px;
      font-weight: 700;
    }

    h1 {
      margin: 0;
      font-size: 46px;
      line-height: 1.14;
      letter-spacing: 0;
    }

    .subtitle {
      margin-top: 10px;
      color: var(--muted);
      font-size: 22px;
      line-height: 1.4;
    }

    .slide-body {
      min-height: 0;
      padding: 26px 34px 30px;
      overflow: auto;
    }

    .grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(300px, 0.78fr);
      gap: 26px;
      align-items: start;
    }

    .bullets {
      margin: 0;
      padding-left: 28px;
      font-size: 27px;
      line-height: 1.44;
    }

    .bullets li { margin-bottom: 14px; }
    .bullets strong { color: var(--accent); }

    .note {
      margin-top: 18px;
      padding: 16px 18px;
      border-left: 5px solid var(--green);
      background: #edf8f5;
      border-radius: 4px 8px 8px 4px;
      font-size: 20px;
      line-height: 1.5;
    }

    pre {
      margin: 0;
      padding: 18px;
      border-radius: 8px;
      background: var(--code-bg);
      color: var(--code-ink);
      overflow: auto;
      font-family: var(--code-font);
      font-size: 18px;
      line-height: 1.45;
      white-space: pre;
    }

    code.fn {
      color: #8ee9ff;
      text-decoration: underline;
      cursor: pointer;
    }

    .diagram {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 18px;
      background: #f6f8fb;
    }

    .flow {
      display: grid;
      gap: 12px;
      font-size: 20px;
      font-weight: 700;
    }

    .flow-row {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 12px;
    }

    .box {
      min-height: 62px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 10px;
      border: 2px solid #b8cadc;
      border-radius: 8px;
      background: #fff;
    }

    .arrow {
      color: var(--accent);
      font-size: 28px;
      font-weight: 900;
    }

    .canvas {
      position: relative;
      aspect-ratio: 4 / 3;
      border: 2px solid #31435c;
      border-radius: 8px;
      background:
        linear-gradient(#d9e4ef 1px, transparent 1px),
        linear-gradient(90deg, #d9e4ef 1px, transparent 1px),
        #fff;
      background-size: 10% 10%;
      overflow: hidden;
    }

    .grass {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 22%;
      background: linear-gradient(180deg, #72bc62, #347a3d);
      border-top: 4px solid #275e31;
    }

    .boy {
      position: absolute;
      width: 48px;
      height: 64px;
      border: 2px solid #183152;
      border-radius: 18px 18px 10px 10px;
      background: linear-gradient(180deg, #4e90d8 0 54%, #263d66 54% 100%);
      box-shadow: 0 5px 0 rgba(24, 49, 82, 0.12);
    }

    .boy::before {
      content: "";
      position: absolute;
      width: 24px;
      height: 24px;
      left: 10px;
      top: -18px;
      border: 2px solid #183152;
      border-radius: 50%;
      background: #f1c69a;
    }

    .boy.center { left: 50%; top: 50%; transform: translate(-50%, -50%); }
    .boy.a { left: 15%; bottom: 16%; }
    .boy.b { left: 43%; bottom: 43%; }
    .boy.c { left: 68%; bottom: 20%; }

    .label {
      position: absolute;
      padding: 3px 7px;
      border-radius: 4px;
      background: rgba(255, 255, 255, 0.9);
      color: #31435c;
      font-size: 15px;
      font-weight: 700;
    }

    .lb { left: 8px; bottom: 8px; }
    .rb { right: 8px; bottom: 8px; }
    .lt { left: 8px; top: 8px; }
    .ct { left: 50%; top: 50%; transform: translate(-50%, -50%); color: var(--accent); }

    details.detail {
      margin-top: 22px;
      border: 1px solid var(--line);
      border-radius: 8px;
      overflow: hidden;
      background: #fff;
    }

    details.detail summary {
      padding: 15px 18px;
      cursor: pointer;
      list-style: none;
      background: #f2f7fc;
      color: var(--accent);
      font-size: 19px;
      font-weight: 800;
    }

    details.detail summary::-webkit-details-marker { display: none; }

    .detail-text {
      padding: 18px;
      color: #263244;
      font-size: 18px;
      line-height: 1.62;
    }

    .detail-text p {
      margin: 0 0 14px;
    }

    .panel {
      min-height: 0;
      display: grid;
      grid-template-rows: auto 1fr;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 8px;
      overflow: hidden;
    }

    .panel-head {
      padding: 16px 18px;
      border-bottom: 1px solid var(--line);
      background: #f7f9fc;
    }

    .panel-head h2 {
      margin: 0;
      font-size: 20px;
    }

    .panel-body {
      min-height: 0;
      overflow: auto;
      padding: 16px 18px 20px;
    }

    .toc {
      display: grid;
      gap: 8px;
    }

    .toc button {
      width: 100%;
      border: 1px solid transparent;
      border-radius: 6px;
      background: transparent;
      padding: 9px 10px;
      text-align: left;
      color: var(--ink);
      font-size: 14px;
      line-height: 1.32;
      cursor: pointer;
    }

    .toc button:hover { background: #eef5fb; }
    .toc button.active {
      border-color: #b8d6ee;
      background: #e6f2fb;
      color: var(--accent);
      font-weight: 800;
    }

    .func-card {
      margin-top: 18px;
      padding-top: 16px;
      border-top: 1px solid var(--line);
    }

    .func-card h3 {
      margin: 0 0 8px;
      color: var(--accent);
      font-size: 19px;
    }

    .func-card p {
      margin: 0 0 10px;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.5;
    }

    .func-card .sample {
      display: block;
      padding: 10px;
      border-radius: 6px;
      background: #eef2f6;
      color: var(--ink);
      font-family: var(--code-font);
      white-space: pre-wrap;
    }

    footer.controls {
      display: grid;
      grid-template-columns: auto 1fr auto auto auto;
      gap: 12px;
      align-items: center;
      padding: 12px 24px 16px;
      background: #fff;
      border-top: 1px solid var(--line);
    }

    button.nav, button.util {
      height: 42px;
      padding: 0 16px;
      border: 1px solid #b8c6d6;
      border-radius: 6px;
      background: #fff;
      color: var(--ink);
      font-weight: 800;
      cursor: pointer;
    }

    button.nav:hover, button.util:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    button.nav:disabled {
      cursor: not-allowed;
      opacity: 0.45;
    }

    .hint {
      text-align: center;
      color: var(--muted);
      font-size: 14px;
    }

    .assignment-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 18px;
    }

    .assignment {
      padding: 18px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #f6f8fb;
    }

    .assignment h3 {
      margin: 0 0 10px;
      color: var(--accent);
      font-size: 24px;
    }

    .assignment ul {
      margin: 0;
      padding-left: 22px;
      font-size: 19px;
      line-height: 1.45;
    }

    @media (max-width: 1080px) {
      body { overflow: auto; }
      .app { height: auto; min-height: 100vh; }
      main { grid-template-columns: 1fr; }
      .slide { height: auto; min-height: 0; max-height: none; }
      .grid, .assignment-grid { grid-template-columns: 1fr; }
      footer.controls {
        position: sticky;
        bottom: 0;
        grid-template-columns: 1fr 1fr;
      }
      .hint { display: none; }
    }
  

    .loader {
      width: min(100%, 900px);
      margin: 40px auto;
      padding: 28px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      box-shadow: 0 14px 34px rgba(23, 32, 51, 0.12);
      font-size: 18px;
      line-height: 1.6;
    }

    .loader h1 {
      font-size: 32px;
      margin-bottom: 12px;
    }

    .loader input {
      margin-top: 14px;
      font-size: 16px;
    }

    body.fullscreen-mode {
      overflow: hidden;
      background: #000;
      --fs-title: clamp(60px, 3.42vw, 110px);
      --fs-subtitle: clamp(26px, 1.5vw, 53px);
      --fs-kicker: clamp(20px, 1.14vw, 38px);
      --fs-pill: clamp(16px, 0.86vw, 29px);
      --fs-body: clamp(38px, 2.18vw, 70px);
      --fs-note: clamp(26px, 1.44vw, 48px);
      --fs-code: clamp(23px, 1.25vw, 41px);
      --fs-flow: clamp(26px, 1.5vw, 50px);
      --fs-label: clamp(20px, 1.14vw, 36px);
      --fs-assignment-title: clamp(31px, 1.74vw, 58px);
      --fs-assignment-body: clamp(26px, 1.38vw, 46px);
      --fs-pad-x: clamp(50px, 2.64vw, 110px);
      --fs-pad-y: clamp(34px, 1.86vw, 77px);
    }

    body.fullscreen-mode header.top,
    body.fullscreen-mode .panel,
    body.fullscreen-mode footer.controls,
    body.fullscreen-mode details.detail {
      display: none;
    }

    body.fullscreen-mode .app {
      height: 100vh;
      min-height: 0;
      display: block;
    }

    body.fullscreen-mode main {
      width: 100vw;
      height: 100vh;
      padding: 0;
      display: block;
    }

    body.fullscreen-mode .stage {
      width: 100vw;
      height: 100vh;
      display: block;
    }

    body.fullscreen-mode .slide {
      width: 100vw;
      height: 100vh;
      min-height: 0;
      max-height: none;
      border: 0;
      border-radius: 0;
      box-shadow: none;
    }

    body.fullscreen-mode .slide-head {
      padding: var(--fs-pad-y) var(--fs-pad-x) clamp(24px, 1.26vw, 50px);
    }

    body.fullscreen-mode .kicker {
      font-size: var(--fs-kicker);
      margin-bottom: clamp(12px, 0.62vw, 24px);
    }

    body.fullscreen-mode .pill {
      font-size: var(--fs-pill);
      padding: clamp(6px, 0.34vw, 12px) clamp(12px, 0.62vw, 24px);
    }

    body.fullscreen-mode h1 {
      font-size: var(--fs-title);
      line-height: 1.12;
    }

    body.fullscreen-mode .subtitle {
      margin-top: clamp(14px, 0.74vw, 29px);
      font-size: var(--fs-subtitle);
      line-height: 1.38;
    }

    body.fullscreen-mode .slide-body {
      padding: var(--fs-pad-y) var(--fs-pad-x) clamp(41px, 2.16vw, 86px);
    }

    body.fullscreen-mode .grid {
      gap: clamp(36px, 1.86vw, 77px);
      grid-template-columns: minmax(0, 1fr) minmax(clamp(408px, 21.24vw, 816px), 0.8fr);
    }

    body.fullscreen-mode .bullets {
      padding-left: clamp(38px, 2vw, 79px);
      font-size: var(--fs-body);
      line-height: 1.42;
    }

    body.fullscreen-mode .bullets li {
      margin-bottom: clamp(19px, 1vw, 41px);
    }

    body.fullscreen-mode .note {
      margin-top: clamp(24px, 1.26vw, 50px);
      padding: clamp(22px, 1.14vw, 46px) clamp(24px, 1.26vw, 50px);
      border-left-width: clamp(7px, 0.38vw, 14px);
      font-size: var(--fs-note);
      line-height: 1.5;
    }

    body.fullscreen-mode pre {
      padding: clamp(24px, 1.26vw, 50px);
      font-size: var(--fs-code);
      line-height: 1.45;
    }

    body.fullscreen-mode .diagram {
      padding: clamp(26px, 1.38vw, 55px);
    }

    body.fullscreen-mode .flow {
      gap: clamp(17px, 0.88vw, 36px);
      font-size: var(--fs-flow);
    }

    body.fullscreen-mode .box {
      min-height: clamp(91px, 4.74vw, 182px);
      padding: clamp(22px, 1.14vw, 46px);
    }

    body.fullscreen-mode .arrow {
      font-size: clamp(41px, 2.12vw, 82px);
    }

    body.fullscreen-mode .canvas {
      min-height: clamp(504px, 26.28vw, 912px);
    }

    body.fullscreen-mode .label {
      padding: clamp(6px, 0.34vw, 12px) clamp(11px, 0.56vw, 22px);
      font-size: var(--fs-label);
    }

    body.fullscreen-mode .assignment-grid {
      gap: clamp(24px, 1.26vw, 50px);
    }

    body.fullscreen-mode .assignment {
      padding: clamp(24px, 1.26vw, 50px);
    }

    body.fullscreen-mode .assignment h3 {
      font-size: var(--fs-assignment-title);
      margin-bottom: clamp(14px, 0.74vw, 29px);
    }

    body.fullscreen-mode .assignment ul {
      padding-left: clamp(31px, 1.62vw, 62px);
      font-size: var(--fs-assignment-body);
      line-height: 1.45;
    }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">
      <strong id="course-title"></strong>
      <span id="slide-title"></span>
    </div>
    <div class="counter">
      <div class="bar"><div id="bar-fill" class="bar-fill"></div></div>
      <span id="page-count">0 / 0</span>
    </div>
  </header>

  <main>
    <section class="stage" id="stage">
</section>

    <aside class="panel">
      <div class="panel-head"><h2 id="panel-title"></h2></div>
      <div class="panel-body">
        <nav class="toc" id="toc"></nav>
        <section class="func-card" id="func-card">
        </section>
      </div>
    </aside>
  </main>

  <footer class="controls">
    <button class="nav" id="prev" type="button"></button>
    <div class="hint" id="keyboard-hint"></div>
    <button class="util" id="detail-toggle" type="button"></button>
    <button class="util" id="fullscreen-toggle" type="button"></button>
    <button class="nav" id="next" type="button"></button>
  </footer>
</div>

<script>
  let deck = null;
  let slides = [];
  let index = 0;

  const stage = document.getElementById('stage');
  const toc = document.getElementById('toc');
  const slideTitle = document.getElementById('slide-title');
  const courseTitle = document.getElementById('course-title');
  const pageCount = document.getElementById('page-count');
  const barFill = document.getElementById('bar-fill');
  const prev = document.getElementById('prev');
  const next = document.getElementById('next');
  const detailToggle = document.getElementById('detail-toggle');
  const fullscreenToggle = document.getElementById('fullscreen-toggle');
  const funcCard = document.getElementById('func-card');
  const keyboardHint = document.getElementById('keyboard-hint');
  const panelTitle = document.getElementById('panel-title');

  function renderVisual(visual) {
    if (!visual) return '';
    const kind = typeof visual === 'string' ? visual : visual.kind;
    if (kind === 'gameFlow') {
      const rows = visual.rows || [];
      return `<div class="diagram"><div class="flow">${rows.map(row => `<div class="flow-row"><div class="box">${row[0]}</div><div class="arrow">→</div><div class="box">${row[1]}</div></div>`).join('')}</div></div>`;
    }
    if (kind === 'scene') {
      return `<div class="diagram canvas"><div class="grass"></div><div class="boy a"></div><div class="boy b"></div><div class="boy c"></div><span class="label lb">${visual.label || ''}</span></div>`;
    }
    if (kind === 'coordinates') {
      const labels = visual.labels || [];
      return `<div class="diagram canvas">${labels.map(label => `<span class="label ${label.className}">${label.text}</span>`).join('')}</div>`;
    }
    if (kind === 'pivot') {
      const labels = visual.labels || [];
      return `<div class="diagram canvas"><div class="grass"></div><div class="boy center"></div>${labels.map(label => `<span class="label ${label.className}">${label.text}</span>`).join('')}</div>`;
    }
    return '';
  }

  function renderAssignments(assignments) {
    if (!assignments || !assignments.length) return '';
    return `<div class="assignment-grid">${assignments.map(item => `<div class="assignment"><h3>${item.title}</h3><ul>${item.items.map(li => `<li>${li}</li>`).join('')}</ul></div>`).join('')}</div>`;
  }

  function renderContent(value) {
    if (Array.isArray(value)) return value.join('');
    return value || '';
  }

  function uiText(key) {
    return (deck && deck.ui && deck.ui[key]) || '';
  }

  function renderSlide(slide, isActive) {
    const bullets = (slide.bullets || []).map(item => `<li>${item}</li>`).join('');
    const code = slide.code ? `<pre><code>${renderContent(slide.code)}</code></pre>` : '';
    const visual = renderVisual(slide.visual);
    const assignments = renderAssignments(slide.assignments);
    const note = slide.note ? `<div class="note">${renderContent(slide.note)}</div>` : '';
    const side = code || visual;
    const body = assignments
      ? `${assignments}${note}`
      : side
        ? `<div class="grid"><div><ul class="bullets">${bullets}</ul>${note}</div>${side}</div>`
        : `<ul class="bullets">${bullets}</ul>${note}`;
    return `<article class="slide${isActive ? ' active' : ''}" data-title="${slide.navTitle || slide.title}">
      <div class="slide-head">
        <div class="kicker"><span class="pill">${slide.section || ''}</span> ${slide.kicker || ''}</div>
        <h1>${slide.title}</h1>
        <div class="subtitle">${slide.subtitle || ''}</div>
      </div>
      <div class="slide-body">
        ${body}
        <details class="detail">
          <summary>${uiText('detailSummary')}</summary>
          <div class="detail-text">${renderContent(slide.detailHtml)}</div>
        </details>
      </div>
    </article>`;
  }

  function renderFunctionPlaceholder() {
    funcCard.innerHTML = `<h3>${uiText('functionPanelTitle')}</h3><p>${uiText('functionPanelBody')}</p><span class="sample">${uiText('functionPanelSample')}</span>`;
  }

  function applyUiText() {
    document.title = uiText('documentTitle') || deck.deckTitle || deck.courseTitle || document.title;
    panelTitle.textContent = uiText('panelTitle');
    prev.textContent = uiText('previousButton');
    next.textContent = uiText('nextButton');
    detailToggle.textContent = uiText('detailButton');
    fullscreenToggle.textContent = uiText('fullscreenButton');
    keyboardHint.textContent = deck.keyboardHint || '';
    renderFunctionPlaceholder();
  }

  function initDeck(data, preferredIndex = 0) {
    deck = data;
    applyUiText();
    courseTitle.textContent = data.courseTitle || '';
    stage.innerHTML = (data.slides || []).map((slide, i) => renderSlide(slide, i === 0)).join('');
    slides = Array.from(document.querySelectorAll('.slide'));
    renderToc();
    go(preferredIndex);
    syncFullscreenMode();
  }

  function renderToc() {
    toc.innerHTML = '';
    slides.forEach((slide, i) => {
      const button = document.createElement('button');
      button.type = 'button';
      button.textContent = `${i + 1}. ${slide.dataset.title}`;
      button.addEventListener('click', () => go(i));
      toc.appendChild(button);
    });
  }

  function go(nextIndex) {
    if (!slides.length) return;
    index = Math.max(0, Math.min(slides.length - 1, nextIndex));
    slides.forEach((slide, i) => slide.classList.toggle('active', i === index));
    Array.from(toc.children).forEach((button, i) => button.classList.toggle('active', i === index));
    slideTitle.textContent = slides[index].dataset.title;
    pageCount.textContent = `${index + 1} / ${slides.length}`;
    barFill.style.width = `${((index + 1) / slides.length) * 100}%`;
    prev.disabled = index === 0;
    next.disabled = index === slides.length - 1;
  }

  function showFunction(name) {
    const doc = deck && deck.functions && deck.functions[name];
    if (!doc) return;
    funcCard.innerHTML = `<h3>${doc.title}</h3><p><strong>${uiText('functionRoleLabel')}:</strong> ${doc.role}</p><span class="sample">${doc.sample}</span><p><strong>${uiText('functionNoteLabel')}:</strong> ${doc.note}</p>`;
  }

  function isFullscreen() {
    return Boolean(document.fullscreenElement);
  }

  async function toggleFullscreen() {
    if (isFullscreen()) {
      await document.exitFullscreen();
      return;
    }
    await document.documentElement.requestFullscreen();
  }

  function syncFullscreenMode() {
    const active = isFullscreen();
    document.body.classList.toggle('fullscreen-mode', active);
    fullscreenToggle.textContent = active ? uiText('exitFullscreenButton') : uiText('fullscreenButton');
  }
  function readEmbeddedDeck() {
    const source = document.getElementById('deck-data').textContent;
    return JSON.parse(source);
  }

  prev.addEventListener('click', () => go(index - 1));
  next.addEventListener('click', () => go(index + 1));
  detailToggle.addEventListener('click', () => {
    const detail = slides[index] && slides[index].querySelector('details.detail');
    if (detail) detail.open = !detail.open;
  });
  fullscreenToggle.addEventListener('click', () => toggleFullscreen().catch(console.warn));
  document.addEventListener('fullscreenchange', syncFullscreenMode);

  document.addEventListener('click', (event) => {
    const target = event.target.closest('[data-fn]');
    if (target) showFunction(target.dataset.fn);
  });

  window.addEventListener('keydown', (event) => {
    if (event.key === 'ArrowRight') go(index + 1);
    if (event.key === 'ArrowLeft') go(index - 1);
    if (event.key.toLowerCase() === 'f') {
      toggleFullscreen().catch(console.warn);
    }
    if (!isFullscreen() && event.key.toLowerCase() === 'd') {
      const detail = slides[index] && slides[index].querySelector('details.detail');
      if (detail) detail.open = !detail.open;
    }
  });
  initDeck(readEmbeddedDeck());
</script>
</body>
</html>
